@Kopernicus:AFTER[MPE]
{
    @Body[Flake]
    {
        @PQS
        {
            @Mods
            {
                @LandControl
                {
                    @Scatters
                    {
                        @Value,*
                        {
                            @Material
                            {
                                @bumpMap ^= :^BUILTIN/MinmusBoulder$:BUILTIN/MinmusBoulder [Diffuse]:
                            }
                        }

                        @Value[SnowBoulder]
                        {
                            @Material
                            {
                                @mainTex ^= :^BUILTIN/MinmusSnowBoulder$:BUILTIN/MinmusSnowBoulder [Diffuse]:
                            }
                        }
                    }
                }
            }
        }
    }

    @Body[Kal]
    {
        @PQS
        {
            @Mods
            {
                @LandControl
                {
                    @Scatters
                    {
                        @Value,*
                        {
                            @Material
                            {
                                @bumpMap ^= :^BUILTIN/MinmusBoulder$:BUILTIN/MinmusBoulder [Diffuse]:
                            }
                        }

                        @Value[SnowBoulder]
                        {
                            @Material
                            {
                                @mainTex ^= :^BUILTIN/MinmusSnowBoulder$:BUILTIN/MinmusSnowBoulder [Diffuse]:
                            }
                        }
                    }
                }
            }
        }
    }

    @Body[Havous]
    {
        @PQS
        {
            @Mods
            {
                @LandControl
                {
                    @Scatters
                    {
                        @Value,*
                        {
                            @Material
                            {
                                @bumpMap ^= :^BUILTIN/MinmusBoulder$:BUILTIN/MinmusBoulder [Diffuse]:
                                @mainTex ^= :^BUILTIN/MinmusIceBoulder$:BUILTIN/MinmusIceBoulder [Diffuse]:
                            }
                        }

                        @Value[SnowBoulder]
                        {
                            @Material
                            {
                                @mainTex ^= :^BUILTIN/MinmusSnowBoulder$:BUILTIN/MinmusSnowBoulder [Diffuse]:
                            }
                        }
                    }
                }
            }
        }
    }
}
